<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Editing Mega Bundle | Save Time & Elevate Your Edits</title>
    <meta name="description" content="6,000+ premium video editing assets. Transitions, LUTs, overlays, sound FX, presets and more. One-time $9 lifetime access." />

    <!-- Critical inline CSS: paints black background instantly before any file loads -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html{scroll-behavior:smooth}
      body{background-color:#050505;color:#f8fafc;font-family:ui-sans-serif,system-ui,sans-serif;min-height:100vh}
      #root{min-height:100vh}
    </style>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load only weights actually used — cuts font from 215 KiB to ~80 KiB -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" />
    </noscript>

    <!-- Preload LCP background image — fixes 1,510ms element render delay -->
    <link rel="preload" as="image" href="/images/background.webp" fetchpriority="high" />
  </head>
  <body class="bg-[#050505] text-[#f8fafc]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
